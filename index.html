<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>genkou — 原稿用紙</title>
<style>
*{box-sizing:border-box}
:root{--paper:#fffdf7;--ink:#171717;--line:#8f877b;--bg:#eeeae2}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{height:52px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;margin:0;font-weight:600}
a{color:inherit}
.paper-wrap{padding:12px 18px 40px;overflow:auto}
.paper{
  width:200mm;
  height:200mm;
  min-width:200mm;
  min-height:200mm;
  margin:0 auto;
  padding:0;
  background:var(--paper);
  box-shadow:0 3px 18px #0002;
}
.grid{
  width:200mm;height:200mm;
  display:grid;
  grid-template-columns:repeat(20,10mm);
  grid-template-rows:repeat(20,10mm);
  border:0.3mm solid var(--line);
}
.cell{
  width:10mm;height:10mm;
  display:flex;
  align-items:center;
  justify-content:center;
  border-left:0.2mm solid var(--line);
  border-top:0.2mm solid var(--line);
  font:7.2mm/1 "Noto Serif JP","Yu Mincho",serif;
  overflow:hidden;
}
.cell:nth-child(-n+20){border-top:0}
.cell:nth-child(20n+1){border-left:0}
.cell.br:after{content:"";position:absolute}
.meta{position:fixed;right:16px;bottom:14px;font-size:12px;color:#666}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff}
  header,.meta{display:none}
  .paper-wrap{padding:0;overflow:visible}
  .paper{margin:0;box-shadow:none}
}
@media(max-width:210mm){
  .paper-wrap{padding:0}
  .paper{transform-origin:top left;transform:scale(calc((100vw - 16px) / 200mm));margin:0}
}
</style>
</head>
<body>
<header>
  <h1>genkou / 400字原稿用紙</h1>
  <a href="./input.html">入力</a>
</header>
<main class="paper-wrap">
  <div class="paper"><div id="grid" class="grid" aria-label="400字原稿用紙"></div></div>
</main>
<div class="meta">JIS S 5508:2010 の20字×20字・10mmますけいに合わせた表示</div>
<script src="./app.js"></script>
</body>
</html>
